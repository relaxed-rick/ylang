name: Feature request
description: Suggest a ylang improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow should become easier?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Video subtitles
        - Reading mode
        - Translation providers
        - Local LLM
        - Learned Items
        - Anki export
        - Settings
        - Release/docs
        - Other
    validations:
      required: true
