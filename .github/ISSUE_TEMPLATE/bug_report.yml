name: Bug report
description: Report something broken in ylang.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for testing ylang. Please do not attach copyrighted subtitles, media clips, API keys, or private learning data.
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version, for example Brave 1.XX or Chrome 1XX.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or site
      description: URL or site name. Remove private tokens.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Press..."
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste short relevant errors only.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, private learning data, subtitles, translations, and media clips from this report.
          required: true
